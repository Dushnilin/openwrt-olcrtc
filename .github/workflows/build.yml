name: Build packages (multi-arch)

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt version (e.g. 25.12.3, 24.10.6)'
        required: false
      target:
        description: 'Target (e.g. mediatek/filogic, x86/64)'
        required: false
      publish_release:
        description: 'Publish release (default: true)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  meta:
    name: Determine version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: v
        name: Read package version
        run: |
          if [ -n "${{ github.ref_name }}" ] && echo "${{ github.ref }}" | grep -q 'refs/tags/'; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            VER=$(grep -E '^PKG_VERSION:=' olcrtc/Makefile | cut -d= -f2 | tr -d ' ')
            TAG="v$VER"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "olcRTC version: $VER, tag: $TAG"

  build:
    name: build (${{ matrix.openwrt_version }}, ${{ matrix.target }})
    needs: meta
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        openwrt_version: ['25.12.3', '24.10.6']
        target:
          - 'mediatek/filogic'
          - 'x86/64'
          - 'ramips/mt7621'
          - 'qualcommax/ipq807x'
          - 'rockchip/armv8'
          - 'bcm27xx/bcm2711'
          - 'ipq40xx/generic'
          - 'ath79/generic'
    env:
      OPENWRT_VERSION: ${{ matrix.openwrt_version }}
      TARGET:          ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache file gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-distutils python3-pyelftools rsync \
            subversion unzip wget zlib1g-dev libelf-dev zstd

      - name: Resolve SDK URL
        id: sdk
        run: |
          set -e
          if [ "$OPENWRT_VERSION" = "SNAPSHOT" ]; then
            BASE="https://downloads.openwrt.org/snapshots/targets/${TARGET}"
          else
            BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}"
          fi
          echo "Base: $BASE"
          SDK_FILE=$(curl -fsSL "$BASE/" \
            | grep -oE 'openwrt-sdk[^"]+x86_64\.tar\.(xz|zst)' \
            | head -n1)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::SDK archive not found at $BASE/"
            curl -fsSL "$BASE/" | grep -oE 'openwrt-sdk[^"]+' | head -5
            exit 1
          fi
          echo "SDK file: $SDK_FILE"
          echo "url=${BASE}/${SDK_FILE}" >> "$GITHUB_OUTPUT"
          echo "file=${SDK_FILE}"        >> "$GITHUB_OUTPUT"

      - name: Download SDK
        run: |
          wget -q "${{ steps.sdk.outputs.url }}" -O sdk.archive
          mkdir sdk
          case "${{ steps.sdk.outputs.file }}" in
            *.tar.zst) tar --zstd -xf sdk.archive -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf       sdk.archive -C sdk --strip-components=1 ;;
            *) echo "unknown archive format"; exit 1 ;;
          esac

      - name: Install feeds
        working-directory: sdk
        run: |
          cp feeds.conf.default feeds.conf
          echo "src-link olcrtc ${GITHUB_WORKSPACE}" >> feeds.conf
          ./scripts/feeds update -a
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/sbwml/packages_lang_golang -b 26.x feeds/packages/lang/golang
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p olcrtc

      - name: Configure
        working-directory: sdk
        run: |
          cat > .config <<EOF
          CONFIG_ALL_NONSHARED=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=n
          CONFIG_PACKAGE_olcrtc=m
          CONFIG_PACKAGE_olcrtc-tun2socks=m
          CONFIG_PACKAGE_luci-app-olcrtc=m
          CONFIG_PACKAGE_luci-i18n-olcrtc-ru=m
          CONFIG_PACKAGE_hev-socks5-tunnel=m
          EOF
          make defconfig

      - name: Build
        working-directory: sdk
        run: |
          make package/olcrtc/compile           V=s -j$(nproc) || make package/olcrtc/compile           V=s
          make package/olcrtc-tun2socks/compile V=s -j$(nproc) || make package/olcrtc-tun2socks/compile V=s
          make package/luci-app-olcrtc/compile  V=s -j$(nproc) || make package/luci-app-olcrtc/compile  V=s
          make package/luci-i18n-olcrtc-ru/compile V=s -j$(nproc) || true

      - name: Collect packages
        run: |
          mkdir -p artifacts
          safe_target="${TARGET//\//-}"
          VER="${{ needs.meta.outputs.version }}"
          REL=$(grep -E '^PKG_RELEASE:=' olcrtc/Makefile | cut -d= -f2 | tr -d ' ' || echo "1")
          FULL_VER="${VER}-${REL}"

          # Копируем .ipk (содержат архитектуру в названии)
          find sdk/bin \( \
              -name 'olcrtc*.ipk' -o \
              -name 'luci-app-olcrtc*.ipk' -o \
              -name 'luci-i18n-olcrtc-*.ipk' \
          \) -exec cp {} artifacts/ \;

          # Обработка .apk:
          # Для бинарного olcrtc добавляем архитектуру, чтобы не было коллизий
          find sdk/bin \( \
              -name 'olcrtc*.apk' -o \
              -name 'luci-app-olcrtc*.apk' -o \
              -name 'luci-i18n-olcrtc-*.apk' \
          \) | while read -r apk_path; do
            apk_name=$(basename "$apk_path")
            if echo "$apk_name" | grep -qE '^olcrtc-[0-9]'; then
              arch_dir=$(echo "$apk_path" | awk -F'/packages/' '{print $2}' | cut -d'/' -f1)
              if [ -n "$arch_dir" ]; then
                cp "$apk_path" "artifacts/olcrtc_${FULL_VER}_${arch_dir}.apk"
              fi
            else
              cp "$apk_path" artifacts/
            fi
          done

          ls -la artifacts/
          count=$(ls -1 artifacts/ 2>/dev/null | wc -l)
          echo "Collected $count package(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::No olcrtc packages produced. Check the Build step."
            echo "--- bin tree (debug) ---"
            find sdk/bin -maxdepth 6 -type d | head -30
            find sdk/bin -name '*.apk' -o -name '*.ipk' | grep -i olcrtc || true
            exit 1
          fi

      - name: Compute artifact name
        id: artname
        run: |
          safe_target="${TARGET//\//-}"
          echo "name=olcrtc-${OPENWRT_VERSION}-${safe_target}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artname.outputs.name }}
          path: |
            artifacts/*.ipk
            artifacts/*.apk

  release:
    name: Publish Release
    needs: [meta, build]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release files and checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum *.ipk *.apk 2>/dev/null > SHA256SUMS || sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          files: |
            dist/*.ipk
            dist/*.apk
            dist/SHA256SUMS
          generate_release_notes: true
